<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survey for Foreign Workers in Taiwan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- 字型非同步載入：網路慢時不會卡住問卷 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
<style>
  :root {
    --bg: #F6F8F7; --card: #FFFFFF; --line: #DCE3E0; --ink: #14202B; --body: #2C3A46;
    --muted: #4A5865; --accent: #0F6B5C; --accent-dark: #0A4F44; --tint: #E3EFEC;
    --warn-bg: #FFF4E5; --warn-ink: #7A4100; --err: #B42318;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Noto Sans', 'Noto Sans TC', 'Noto Sans Thai', system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 20px 48px; display: flex; flex-direction: column; gap: 20px; }
  h1 { margin: 0; font-size: 26px; line-height: 1.3; }
  h2 { margin: 0; font-size: 17px; }
  p { margin: 0; line-height: 1.65; color: var(--body); font-size: 15px; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); }
  .muted { color: var(--muted); font-size: 13px; line-height: 1.6; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .letter { gap: 14px; }
  .share { gap: 14px; }
  .share-ask { font-size: 16px; font-weight: 600; color: var(--ink); }
  .share-ask .bi-tl { font-weight: 400; }
  .btn .bi-tl { font-size: 0.8em; font-weight: 400; color: inherit; opacity: .9; }
  .vignette.context { margin-bottom: 4px; }
  .bi-en { display: block; }
  .bi-tl { display: block; margin-top: 3px; font-weight: 400; font-size: 0.9em; color: var(--muted); }
  h1 .bi-tl { font-size: 0.62em; margin-top: 4px; }
  .choose-lang { font-size: 15px; line-height: 1.7; color: var(--muted); }
  .choose-lang .phrase { white-space: nowrap; }
  .signoff { font-size: 14px; line-height: 1.7; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
  .card.missing { border-color: #D97706; box-shadow: 0 0 0 2px #FDE7C7; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--tint); color: var(--accent-dark); font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; }
  .lang-btn { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 60px; padding: 12px 18px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
  .lang-btn:hover, .lang-btn:focus-visible { border-color: var(--accent); }
  .lang-btn { gap: 12px; padding: 16px 18px; }
  .lang-text { display: flex; flex-direction: column; gap: 4px; }
  .lang-name { font-size: 17px; font-weight: 700; display: block; }
  .lang-title { font-size: 14px; line-height: 1.5; color: var(--body); display: block; }
  .lang-arrow { font-size: 22px; color: var(--accent); }
  .btn { min-height: 54px; border-radius: 14px; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; padding: 0 20px; border: 1.5px solid var(--accent); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { background: #9DB8B2; border-color: #9DB8B2; cursor: not-allowed; }
  .btn-ghost { background: #fff; color: var(--accent); }
  .btn-row { display: flex; gap: 12px; }
  .btn-row .btn { flex: 1; }
  .link-btn { background: none; border: none; color: var(--accent); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 44px; padding: 0; text-align: left; }
  fieldset { border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  legend { font-size: 16px; font-weight: 600; line-height: 1.5; margin-bottom: 8px; padding: 0; }
  .opt { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-size: 15px; line-height: 1.4; }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--tint); }
  /* 自訂圓圈：未選是白色，選了才填色 */
  .opt input { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; margin: 0; flex-shrink: 0;
    border: 2px solid #B7C4C0; border-radius: 50%; background: #fff; cursor: pointer; }
  .opt input:checked { border-color: var(--accent); box-shadow: inset 0 0 0 4px #fff; background: var(--accent); }
  .opt input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .check { display: flex; align-items: flex-start; gap: 12px; min-height: 44px; font-size: 15px; line-height: 1.5; cursor: pointer; }
  .check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); flex-shrink: 0; }
  label.q { font-size: 16px; font-weight: 600; line-height: 1.5; }
  input[type=number], textarea { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  textarea { min-height: 110px; resize: vertical; }
  input[type=text].other-in { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  select { width: 100%; min-height: 50px; font: inherit; font-size: 16px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  .num-row { display: flex; align-items: center; gap: 10px; }
  .num-row input { flex: 0 1 140px; }
  .num-row input.money-in { flex: 1 1 auto; min-width: 0; font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  .unit { font-size: 15px; color: var(--body); white-space: nowrap; }
  .hint { font-size: 13px; line-height: 1.55; color: var(--muted); margin-top: -4px; }
  .err { color: var(--err); font-size: 14px; }
  .banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 12px; padding: 14px 16px; font-size: 14px; line-height: 1.55; }
  .progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); }
  .vignette { white-space: pre-line; background: #EEF3F1; border-radius: 12px; padding: 16px; font-size: 15px; line-height: 1.7; color: var(--body); }
  .hotline { display: flex; align-items: center; gap: 14px; }
  .hotline b { min-width: 64px; font-size: 22px; color: var(--accent); }
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  .slider-wrap { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
  /* 拉桿：自訂外觀，不顯示「填滿」，避免看起來像已經有預設答案 */
  .slider, .slider-v { -webkit-appearance: none; appearance: none; background: transparent; margin: 0; cursor: pointer; }
  .slider { width: 100%; height: 36px; }
  .slider-v { writing-mode: vertical-lr; direction: rtl; width: 36px; height: 100%; }
  .slider::-webkit-slider-runnable-track { height: 8px; background: var(--line); border-radius: 999px; }
  .slider-v::-webkit-slider-runnable-track { width: 8px; background: var(--line); border-radius: 999px; }
  .slider::-moz-range-track { height: 8px; background: var(--line); border-radius: 999px; }
  .slider-v::-moz-range-track { width: 8px; background: var(--line); border-radius: 999px; }
  .slider::-webkit-slider-thumb, .slider-v::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); border: 3px solid #fff; box-shadow: 0 0 0 1px var(--accent), 0 1px 3px rgba(0,0,0,.25); }
  .slider::-webkit-slider-thumb { margin-top: -10px; }
  .slider-v::-webkit-slider-thumb { margin-left: -10px; }
  .slider::-moz-range-thumb, .slider-v::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 0 0 1px var(--accent); }
  .slider.untouched::-webkit-slider-thumb, .slider-v.untouched::-webkit-slider-thumb { opacity: 0; }
  .slider.untouched::-moz-range-thumb, .slider-v.untouched::-moz-range-thumb { opacity: 0; }
  .slider:focus-visible, .slider-v:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
  /* 刻度對準拉桿上的 5 個位置（拉桿頭 28px，兩端內縮 14px） */
  .ticks { position: relative; height: 20px; margin: 0 14px; font-size: 14px; font-weight: 600; color: var(--body); }
  .ticks span { position: absolute; top: 0; transform: translateX(-50%); }
  .ends { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); }
  .ends > span { display: block; }
  .ends > span:last-child { text-align: right; }
  .slider-v-wrap { display: flex; gap: 16px; align-items: stretch; height: 260px; padding: 8px 0; }
  .ticks-v { position: relative; flex: 1; margin: 14px 0; font-size: 14px; color: var(--body); }
  .ticks-v span { position: absolute; left: 0; transform: translateY(-50%); }
  .slider-val { font-size: 15px; font-weight: 700; color: var(--accent); min-height: 22px; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

  // 同意頁（開頭語）：英文版為研究者提供的正式版本；zh 為對照用；id / vi / th 由 Claude 草擬，待你提供正式翻譯
  consent: {
    title: { zh: "在台移工的金融帳戶決策研究", en: "Financial account decision-making among migrant workers in Taiwan", id: "Pengambilan keputusan terkait rekening keuangan di kalangan pekerja migran di Taiwan", vi: "Quyết định về tài khoản tài chính của lao động di trú tại Đài Loan", th: "การตัดสินใจเกี่ยวกับบัญชีการเงินของแรงงานข้ามชาติในไต้หวัน" },
    greeting: { zh: "親愛的參與者您好：", en: "Dear Participant,", id: "Peserta yang terhormat,", vi: "Kính gửi Quý vị tham gia,", th: "เรียน ผู้เข้าร่วมวิจัย" },
    blocks: [
      { zh: "我是蔡逸騏，國立臺北大學的研究生，目前正在進行在台移工金融帳戶決策的研究。如果您年滿 18 歲、目前在台灣工作，誠摯邀請您填寫這份問卷，大約不到 10 分鐘即可完成。您的參與對這項研究非常重要，也可能有助於未來改善對移工的支持。",
        en: "My name is Yi-Chi Tsai, and I am a graduate student at National Taipei University. I am doing research on financial account decision-making among migrant workers in Taiwan. If you are at least 18 years old and currently working in Taiwan, I would like to invite you to fill out this questionnaire. It takes less than 10 minutes to complete. Your participation is important to the success of this research, and may help improve support for migrant workers in the future.",
        id: "Nama saya Yi-Chi Tsai, mahasiswa pascasarjana di National Taipei University. Saya sedang melakukan penelitian tentang pengambilan keputusan terkait rekening keuangan di kalangan pekerja migran di Taiwan. Jika Anda berusia minimal 18 tahun dan saat ini bekerja di Taiwan, saya mengundang Anda untuk mengisi kuesioner ini. Pengisiannya kurang dari 10 menit. Partisipasi Anda sangat penting bagi keberhasilan penelitian ini dan dapat membantu meningkatkan dukungan bagi pekerja migran di masa depan.",
        vi: "Tôi là Yi-Chi Tsai, học viên cao học tại Đại học Quốc gia Đài Bắc. Tôi đang nghiên cứu về việc ra quyết định liên quan đến tài khoản tài chính của lao động di trú tại Đài Loan. Nếu bạn từ 18 tuổi trở lên và hiện đang làm việc tại Đài Loan, tôi trân trọng mời bạn điền bảng câu hỏi này. Chỉ mất chưa đến 10 phút. Sự tham gia của bạn rất quan trọng đối với nghiên cứu này và có thể giúp cải thiện sự hỗ trợ dành cho lao động di trú trong tương lai.",
        th: "ผมชื่อ Yi-Chi Tsai เป็นนักศึกษาปริญญาโทที่มหาวิทยาลัยแห่งชาติไทเป กำลังทำวิจัยเรื่องการตัดสินใจเกี่ยวกับบัญชีการเงินของแรงงานข้ามชาติในไต้หวัน หากคุณอายุ 18 ปีขึ้นไปและปัจจุบันทำงานอยู่ในไต้หวัน ขอเชิญคุณตอบแบบสอบถามนี้ ใช้เวลาไม่ถึง 10 นาที การเข้าร่วมของคุณมีความสำคัญต่อความสำเร็จของงานวิจัยนี้ และอาจช่วยพัฒนาการสนับสนุนแรงงานข้ามชาติในอนาคต" },
      { zh: "本研究採匿名方式，並遵守學術倫理。所有資料僅供學術分析使用，不會提供給任何第三方。參與完全自願，您可以隨時停止填答，這不會影響您的工作或在台居留。請放心依照真實情況回答。",
        en: "This study is anonymous and follows academic ethics. All data will be used only for academic analysis and will not be shared with any third party. Participation is voluntary, and you may stop at any time. This will not affect your job or your stay in Taiwan. Please feel free to answer truthfully.",
        id: "Penelitian ini bersifat anonim dan mengikuti etika akademik. Semua data hanya digunakan untuk analisis akademis dan tidak akan dibagikan kepada pihak ketiga mana pun. Partisipasi bersifat sukarela, dan Anda dapat berhenti kapan saja. Hal ini tidak akan memengaruhi pekerjaan atau masa tinggal Anda di Taiwan. Silakan menjawab dengan jujur tanpa ragu.",
        vi: "Nghiên cứu này là ẩn danh và tuân thủ đạo đức học thuật. Mọi dữ liệu chỉ được dùng cho phân tích học thuật và sẽ không được chia sẻ với bất kỳ bên thứ ba nào. Việc tham gia là tự nguyện, và bạn có thể dừng lại bất cứ lúc nào. Điều này sẽ không ảnh hưởng đến công việc hay việc lưu trú của bạn tại Đài Loan. Bạn cứ yên tâm trả lời đúng sự thật.",
        th: "งานวิจัยนี้ไม่ระบุตัวตนและปฏิบัติตามจริยธรรมทางวิชาการ ข้อมูลทั้งหมดจะใช้เพื่อการวิเคราะห์ทางวิชาการเท่านั้น และจะไม่เปิดเผยแก่บุคคลที่สามใดๆ การเข้าร่วมเป็นไปโดยสมัครใจ คุณสามารถหยุดได้ทุกเมื่อ ซึ่งจะไม่มีผลต่องานหรือการพำนักของคุณในไต้หวัน กรุณาตอบตามความจริงได้อย่างสบายใจ" },
      { zh: "如果您認識其他在台移工，歡迎將這份問卷分享給他們。感謝您對這項學術研究的支持與協助！如對本研究有任何疑問，歡迎來信聯絡：s711364105@gm.ntpu.edu.tw",
        en: "If you know other migrant workers in Taiwan, please share this questionnaire with them. Thank you for your support and assistance with this academic research! For any questions about this study, please feel free to contact me via email: s711364105@gm.ntpu.edu.tw",
        id: "Jika Anda mengenal pekerja migran lain di Taiwan, silakan bagikan kuesioner ini kepada mereka. Terima kasih atas dukungan dan bantuan Anda untuk penelitian akademis ini! Jika ada pertanyaan tentang penelitian ini, silakan hubungi saya melalui email: s711364105@gm.ntpu.edu.tw",
        vi: "Nếu bạn quen những lao động di trú khác tại Đài Loan, hãy chia sẻ bảng câu hỏi này với họ. Cảm ơn bạn đã ủng hộ và giúp đỡ nghiên cứu học thuật này! Nếu có bất kỳ câu hỏi nào về nghiên cứu, vui lòng liên hệ với tôi qua email: s711364105@gm.ntpu.edu.tw",
        th: "หากคุณรู้จักแรงงานข้ามชาติคนอื่นในไต้หวัน กรุณาแชร์แบบสอบถามนี้ให้พวกเขา ขอบคุณสำหรับการสนับสนุนและความช่วยเหลือต่องานวิจัยทางวิชาการนี้! หากมีคำถามเกี่ยวกับงานวิจัย ติดต่อได้ทางอีเมล: s711364105@gm.ntpu.edu.tw" }
    ],

    {"id":"partA","title":{"en":"Part A / Bahagi A","id":"Bagian A","vi":"Phần A","th":"ส่วน A"},"items":[{"id":"A_intro","type":"info","label":{"en":"**Below are questions about your financial situation and how you feel about it.** Please choose the number from 1 to 5 that is most appropriate for your situation.\n\n**Ang mga sumusunod na tanong ay tungkol sa iyong kalagayang pinansyal at kung ano ang nararamdaman mo tungkol dito.** Pumili ng numero mula 1 hanggang 5 na pinakaangkop sa iyong sitwasyon.","id":"**Berikut adalah pertanyaan tentang kondisi keuangan Anda dan bagaimana perasaan Anda tentang hal itu.** Silakan pilih angka 1 sampai 5 yang paling sesuai dengan situasi Anda.","vi":"**Dưới đây là các câu hỏi về tình hình tài chính của bạn và cảm nhận của bạn về điều đó.** Vui lòng chọn số từ 1 đến 5 phù hợp nhất với tình huống của bạn.","th":"**ต่อไปนี้เป็นคำถามเกี่ยวกับสถานะทางการเงินของคุณ และความรู้สึกของคุณที่มีต่อเรื่องนี้** กรุณาเลือกตัวเลขตั้งแต่ 1 ถึง 5 ที่ตรงกับสถานการณ์ของคุณมากที่สุด"}},{"id":"A01","type":"scale","anchors":{"low":{"en":"No Stress at All / Walang anumang stress","id":"Tidak stres sama sekali","vi":"Hoàn toàn không căng thẳng","th":"ไม่เครียดเลย"},"high":{"en":"Overwhelming Stress / Labis-labis na stress","id":"Stres yang sangat berat","vi":"Căng thẳng tột độ","th":"เครียดมากที่สุด"}},"label":{"en":"What do you feel is the level of your financial stress today? / Gaano kalaki ang pinansyal na stress na nararamdaman mo ngayon?","id":"Seberapa besar tingkat stres keuangan yang Anda rasakan saat ini?","vi":"Bạn cảm thấy mức độ căng thẳng về tài chính của mình hiện nay như thế nào?","th":"ปัจจุบันคุณรู้สึกเครียดเรื่องการเงินในระดับใด"}},{"id":"A02","type":"scale","anchors":{"low":{"en":"Satisfied / Kontento","id":"Puas","vi":"Hài lòng","th":"พอใจ"},"high":{"en":"Dissatisfied / Hindi kontento","id":"Tidak puas","vi":"Không hài lòng","th":"ไม่พอใจ"}},"label":{"en":"How satisfied are you with your present financial situation? / Gaano ka kontento sa iyong kasalukuyang kalagayang pinansyal?","id":"Seberapa puas Anda dengan kondisi keuangan Anda saat ini?","vi":"Bạn hài lòng như thế nào với tình hình tài chính hiện tại của mình?","th":"คุณพึงพอใจกับสถานะทางการเงินในปัจจุบันของคุณมากน้อยเพียงใด"}},{"id":"A03","type":"scale","anchors":{"low":{"en":"Feel Comfortable / Panatag ang loob","id":"Merasa nyaman","vi":"Cảm thấy thoải mái","th":"รู้สึกสบายใจ"},"high":{"en":"Feel Overwhelmed / Labis na nabibigatan","id":"Merasa sangat terbebani","vi":"Cảm thấy quá sức chịu đựng","th":"รู้สึกหนักใจมาก"}},"label":{"en":"How do you feel about your current financial situation? / Ano ang pakiramdam mo tungkol sa iyong kasalukuyang kalagayang pinansyal?","id":"Bagaimana perasaan Anda tentang kondisi keuangan Anda saat ini?","vi":"Bạn cảm thấy thế nào về tình hình tài chính hiện tại của mình?","th":"คุณรู้สึกอย่างไรกับสถานะทางการเงินในปัจจุบันของคุณ"}},{"id":"A04","type":"scale","anchors":{"low":{"en":"Never Worry / Hindi kailanman nag-aalala","id":"Tidak pernah khawatir","vi":"Không bao giờ lo lắng","th":"ไม่เคยกังวล"},"high":{"en":"Worry All the Time / Palaging nag-aalala","id":"Selalu khawatir","vi":"Lúc nào cũng lo lắng","th":"กังวลตลอดเวลา"}},"label":{"en":"How often do you worry about being able to meet normal monthly living expenses? / Gaano kadalas kang nag-aalala kung kakayanin mong bayaran ang karaniwang buwanang gastusin sa pamumuhay?","id":"Seberapa sering Anda khawatir tidak mampu memenuhi biaya hidup bulanan yang biasa?","vi":"Bạn thường lo lắng đến mức nào về việc có đủ tiền chi trả các chi phí sinh hoạt hằng tháng thông thường hay không?","th":"คุณกังวลบ่อยแค่ไหนว่าจะมีเงินไม่พอจ่ายค่าใช้จ่ายในการดำรงชีวิตตามปกติในแต่ละเดือน"}},{"id":"A05","type":"scale","anchors":{"low":{"en":"High Confidence / Lubos na sigurado","id":"Sangat yakin","vi":"Rất tự tin","th":"มั่นใจมาก"},"high":{"en":"No Confidence / Hindi sigurado","id":"Tidak yakin sama sekali","vi":"Không tự tin","th":"ไม่มั่นใจเลย"}},"label":{"en":"How confident are you that you could find the money to pay for a financial emergency that costs about US$ 1,000? / Gaano ka kasigurado na makakahanap ka ng pera para sa isang pinansyal na emergency na nagkakahalaga ng mga US$ 1,000?","id":"Seberapa yakin Anda bisa mendapatkan uang untuk membayar keadaan darurat keuangan yang biayanya sekitar US$ 1.000?","vi":"Bạn tự tin đến mức nào rằng mình có thể xoay được tiền để chi trả cho một tình huống khẩn cấp về tài chính tốn khoảng 1.000 đô la Mỹ?","th":"คุณมั่นใจแค่ไหนว่าจะหาเงินมาจ่ายค่าใช้จ่ายฉุกเฉินที่มีมูลค่าประมาณ 1,000 ดอลลาร์สหรัฐได้"},"hint":{"en":"Note: US$ 1,000 (approx. NT$ 32,000) / Paalala: US$ 1,000 (humigit-kumulang NT$ 32,000)","id":"Catatan: US$ 1.000 (sekitar NT$ 32.000)","vi":"Lưu ý: 1.000 đô la Mỹ (khoảng 32.000 Đài tệ)","th":"หมายเหตุ: 1,000 ดอลลาร์สหรัฐ (ประมาณ 32,000 เหรียญไต้หวัน)"}},{"id":"A06","type":"scale","anchors":{"low":{"en":"Never / Hindi kailanman","id":"Tidak pernah","vi":"Không bao giờ","th":"ไม่เคย"},"high":{"en":"All the Time / Palagi","id":"Selalu","vi":"Lúc nào cũng vậy","th":"ตลอดเวลา"}},"label":{"en":"How often does this happen to you? You want to go out to eat, go to a movie or do something else and don't go because you can't afford to? / Gaano kadalas ito nangyayari sa iyo? Gusto mong kumain sa labas, manood ng sine, o gumawa ng iba pang bagay, pero hindi ka tumutuloy dahil hindi mo kaya ang gastos?","id":"Seberapa sering hal ini terjadi pada Anda? Anda ingin makan di luar, menonton film, atau melakukan hal lain, tetapi tidak jadi pergi karena tidak mampu membayarnya?","vi":"Điều này xảy ra với bạn thường xuyên đến mức nào? Bạn muốn đi ăn ngoài, đi xem phim hoặc làm việc gì đó khác nhưng không đi vì không đủ tiền?","th":"เรื่องนี้เกิดขึ้นกับคุณบ่อยแค่ไหน: คุณอยากออกไปกินข้าวนอกบ้าน ดูหนัง หรือทำอย่างอื่น แต่ไม่ได้ไปเพราะไม่มีเงินพอ"}},{"id":"A07","type":"scale","anchors":{"low":{"en":"Never / Hindi kailanman","id":"Tidak pernah","vi":"Không bao giờ","th":"ไม่เคย"},"high":{"en":"All the Time / Palagi","id":"Selalu","vi":"Lúc nào cũng vậy","th":"ตลอดเวลา"}},"label":{"en":"How frequently do you find yourself just getting by financially and living paycheck to paycheck? / Gaano kadalas mong nararanasan na sapat lang ang pera mo para makaraos, at umaasa ka lang sa susunod na sahod?","id":"Seberapa sering Anda merasa keuangan Anda hanya pas-pasan dan hidup dari gaji ke gaji?","vi":"Bạn thường xuyên đến mức nào thấy mình chỉ xoay xở vừa đủ về tài chính, tháng nào cũng tiêu hết lương rồi chờ lương tháng sau?","th":"คุณพบว่าตัวเองแค่พอเอาตัวรอดทางการเงิน และใช้เงินเดือนชนเดือนบ่อยแค่ไหน"}},{"id":"A08","type":"scale","anchors":{"low":{"en":"No Stress at All / Walang anumang stress","id":"Tidak stres sama sekali","vi":"Hoàn toàn không căng thẳng","th":"ไม่เครียดเลย"},"high":{"en":"Overwhelming Stress / Labis-labis na stress","id":"Stres yang sangat berat","vi":"Căng thẳng tột độ","th":"เครียดมากที่สุด"}},"label":{"en":"How stressed do you feel about your personal finances in general? / Gaano ka ka-stress sa iyong personal na pananalapi sa pangkalahatan?","id":"Secara umum, seberapa stres Anda terhadap keuangan pribadi Anda?","vi":"Nhìn chung, bạn cảm thấy căng thẳng đến mức nào về tài chính cá nhân của mình?","th":"โดยรวมแล้ว คุณรู้สึกเครียดเกี่ยวกับการเงินส่วนตัวมากน้อยเพียงใด"}},{"id":"A09","type":"single","label":{"en":"Does anyone depend on you for financial support? / May umaasa ba sa iyo para sa suportang pinansyal?","id":"Apakah ada orang yang bergantung pada Anda secara finansial?","vi":"Có ai phụ thuộc vào bạn về mặt tài chính không?","th":"มีคนที่ต้องพึ่งพาคุณทางการเงินหรือไม่"},"options":[{"value":1,"label":{"en":"Yes / Mayroon","id":"Ya, ada","vi":"Có","th":"มี"}},{"value":0,"label":{"en":"No / Wala","id":"Tidak ada","vi":"Không","th":"ไม่มี"}}]},{"id":"A10","type":"number","min":1,"max":30,"showIf":{"item":"A09","in":[1]},"label":{"en":"How many people in your home country depend on the money you send? / Ilang tao sa iyong sariling bansa ang umaasa sa perang ipinapadala mo?","id":"Berapa orang di negara asal Anda yang bergantung pada uang yang Anda kirim?","vi":"Có bao nhiêu người ở quê nhà bạn phụ thuộc vào số tiền bạn gửi về?","th":"มีกี่คนในประเทศบ้านเกิดของคุณที่ต้องพึ่งพาเงินที่คุณส่งกลับไป"}},{"id":"A11","type":"money","label":{"en":"How much did you pay in total in your home country to come to work in Taiwan? (Including agency fees, medical checks, training, airfare, etc.) / Magkano ang kabuuang ibinayad mo sa iyong sariling bansa para makapagtrabaho sa Taiwan? (Kasama ang bayad sa ahensya, medical check-up, training, pamasahe sa eroplano, atbp.)","id":"Berapa total biaya yang Anda bayar di negara asal untuk bisa bekerja di Taiwan? (Termasuk biaya agensi, pemeriksaan kesehatan, pelatihan, tiket pesawat, dll.)","vi":"Tổng cộng bạn đã trả bao nhiêu tiền ở quê nhà để được sang Đài Loan làm việc? (Bao gồm phí môi giới, khám sức khỏe, đào tạo, vé máy bay, v.v.)","th":"คุณจ่ายเงินไปทั้งหมดเท่าไรในประเทศบ้านเกิดเพื่อมาทำงานที่ไต้หวัน (รวมค่านายหน้า ค่าตรวจสุขภาพ ค่าฝึกอบรม ค่าตั๋วเครื่องบิน ฯลฯ)"},"hint":{"en":"Note: Please enter the amount in your home country's currency (numbers only). / Paalala: Ilagay ang halaga sa pera ng iyong sariling bansa (numero lamang).","id":"Catatan: Masukkan jumlahnya dalam mata uang negara asal Anda (hanya angka).","vi":"Lưu ý: Vui lòng nhập số tiền theo đơn vị tiền tệ của nước bạn (chỉ nhập số).","th":"หมายเหตุ: กรุณากรอกจำนวนเงินเป็นสกุลเงินของประเทศบ้านเกิดของคุณ (ตัวเลขเท่านั้น)"}},{"id":"A12","type":"single","label":{"en":"Did you borrow money or take out a loan in your home country to come to work in Taiwan? / Nangutang ka ba o kumuha ng loan sa iyong sariling bansa para makapagtrabaho sa Taiwan?","id":"Apakah Anda meminjam uang atau mengambil pinjaman di negara asal untuk bisa bekerja di Taiwan?","vi":"Bạn có vay tiền hoặc vay nợ ở quê nhà để sang Đài Loan làm việc không?","th":"คุณกู้ยืมเงินหรือขอสินเชื่อในประเทศบ้านเกิดเพื่อมาทำงานที่ไต้หวันหรือไม่"},"options":[{"value":1,"label":{"en":"Yes / Oo","id":"Ya","vi":"Có","th":"ใช่"}},{"value":0,"label":{"en":"No / Hindi","id":"Tidak","vi":"Không","th":"ไม่ใช่"}}]}]},
    {"id":"partB","title":{"en":"Part B / Bahagi B","id":"Bagian B","vi":"Phần B","th":"ส่วน B"},"items":[{"id":"B_intro","type":"info","label":{"en":"**Below are statements about how you might behave in different situations.** There are no right or wrong answers. Please choose the number from 1 to 5 that best describes you.\n\n**Ang mga sumusunod ay mga pahayag tungkol sa kung paano ka maaaring kumilos sa iba't ibang sitwasyon.** Walang tama o maling sagot. Pumili ng numero mula 1 hanggang 5 na pinakanaglalarawan sa iyo.","id":"**Berikut adalah pernyataan tentang bagaimana Anda mungkin bertindak dalam berbagai situasi.** Tidak ada jawaban benar atau salah. Silakan pilih angka 1 sampai 5 yang paling menggambarkan diri Anda.","vi":"**Dưới đây là những nhận định về cách bạn có thể hành xử trong các tình huống khác nhau.** Không có câu trả lời đúng hay sai. Vui lòng chọn số từ 1 đến 5 mô tả đúng nhất về bạn.","th":"**ต่อไปนี้เป็นข้อความเกี่ยวกับการกระทำของคุณในสถานการณ์ต่างๆ** ไม่มีคำตอบที่ถูกหรือผิด กรุณาเลือกตัวเลขตั้งแต่ 1 ถึง 5 ที่อธิบายตัวคุณได้ดีที่สุด"}},{"id":"B01","type":"scale","anchors":{"low":{"en":"Not at All / Hindi talaga","id":"Sama sekali tidak","vi":"Hoàn toàn không đúng","th":"ไม่ตรงเลย"},"high":{"en":"Completely / Lubos","id":"Sepenuhnya","vi":"Hoàn toàn đúng","th":"ตรงทั้งหมด"}},"label":{"en":"I will do the same if I see someone getting away with breaking regulations. / Gagawin ko rin ito kung makita kong may taong lumalabag sa mga regulasyon nang hindi napaparusahan.","id":"Saya akan melakukan hal yang sama jika melihat seseorang melanggar peraturan tanpa mendapat hukuman.","vi":"Nếu thấy ai đó vi phạm quy định mà không bị xử lý, tôi cũng sẽ làm như vậy.","th":"ถ้าฉันเห็นคนอื่นทำผิดกฎระเบียบแล้วไม่ถูกลงโทษ ฉันก็จะทำแบบเดียวกัน"}},{"id":"B02","type":"scale","anchors":{"low":{"en":"Not at All / Hindi talaga","id":"Sama sekali tidak","vi":"Hoàn toàn không đúng","th":"ไม่ตรงเลย"},"high":{"en":"Completely / Lubos","id":"Sepenuhnya","vi":"Hoàn toàn đúng","th":"ตรงทั้งหมด"}},"label":{"en":"I cannot guarantee that I will follow the law in cases where the law clashes with significant personal interests. / Hindi ko masisiguro na susunod ako sa batas sa mga pagkakataong sumasalungat ang batas sa malalaking personal kong interes.","id":"Saya tidak bisa menjamin akan mematuhi hukum jika hukum bertentangan dengan kepentingan pribadi saya yang penting.","vi":"Tôi không thể đảm bảo sẽ tuân thủ pháp luật trong những trường hợp pháp luật mâu thuẫn với lợi ích cá nhân quan trọng của tôi.","th":"ฉันไม่สามารถรับประกันได้ว่าจะปฏิบัติตามกฎหมาย ในกรณีที่กฎหมายขัดกับผลประโยชน์ส่วนตัวที่สำคัญของฉัน"}},{"id":"B03","type":"scale","anchors":{"low":{"en":"Not at All / Hindi talaga","id":"Sama sekali tidak","vi":"Hoàn toàn không đúng","th":"ไม่ตรงเลย"},"high":{"en":"Completely / Lubos","id":"Sepenuhnya","vi":"Hoàn toàn đúng","th":"ตรงทั้งหมด"}},"label":{"en":"I may take advantage of legal loopholes if I see a chance to make profit. / Maaari kong samantalahin ang mga butas sa batas kung may makita akong pagkakataong kumita.","id":"Saya mungkin akan memanfaatkan celah hukum jika melihat kesempatan untuk mendapatkan keuntungan.","vi":"Tôi có thể lợi dụng kẽ hở của pháp luật nếu thấy có cơ hội kiếm lời.","th":"ฉันอาจใช้ประโยชน์จากช่องโหว่ของกฎหมาย ถ้าเห็นโอกาสที่จะได้กำไร"}},{"id":"B04","type":"scale","anchors":{"low":{"en":"Not at All / Hindi talaga","id":"Sama sekali tidak","vi":"Hoàn toàn không đúng","th":"ไม่ตรงเลย"},"high":{"en":"Completely / Lubos","id":"Sepenuhnya","vi":"Hoàn toàn đúng","th":"ตรงทั้งหมด"}},"label":{"en":"It would be hard for me to resist the temptation if someone offers me money to do something illegal. / Mahihirapan akong labanan ang tukso kung may mag-alok sa akin ng pera para gumawa ng ilegal.","id":"Akan sulit bagi saya untuk menolak godaan jika seseorang menawarkan uang kepada saya untuk melakukan sesuatu yang ilegal.","vi":"Tôi sẽ khó cưỡng lại cám dỗ nếu có người trả tiền để tôi làm điều phạm pháp.","th":"ถ้ามีคนเสนอเงินให้ฉันทำสิ่งที่ผิดกฎหมาย ฉันคงอดใจต่อสิ่งยั่วยุได้ยาก"}},{"id":"B05","type":"scale","anchors":{"low":{"en":"Not at All / Hindi talaga","id":"Sama sekali tidak","vi":"Hoàn toàn không đúng","th":"ไม่ตรงเลย"},"high":{"en":"Completely / Lubos","id":"Sepenuhnya","vi":"Hoàn toàn đúng","th":"ตรงทั้งหมด"}},"label":{"en":"Resisting temptation is so struggling that I cannot promise not to break the law when faced with significant temptations. / Napakahirap labanan ang tukso kaya hindi ko maipapangako na hindi ako lalabag sa batas kapag nahaharap sa malalaking tukso.","id":"Menahan godaan begitu sulit sehingga saya tidak bisa berjanji untuk tidak melanggar hukum ketika menghadapi godaan yang besar.","vi":"Cưỡng lại cám dỗ khó khăn đến mức tôi không thể hứa sẽ không vi phạm pháp luật khi đối mặt với những cám dỗ lớn.","th":"การต้านทานสิ่งยั่วยุเป็นเรื่องยากมาก จนฉันไม่อาจสัญญาได้ว่าจะไม่ทำผิดกฎหมายเมื่อเจอสิ่งยั่วยุที่มาก"}},{"id":"B06","type":"scale","anchors":{"low":{"en":"Not at All / Hindi talaga","id":"Sama sekali tidak","vi":"Hoàn toàn không đúng","th":"ไม่ตรงเลย"},"high":{"en":"Completely / Lubos","id":"Sepenuhnya","vi":"Hoàn toàn đúng","th":"ตรงทั้งหมด"}},"label":{"en":"I will reflect on my own problems and make sure not to commit such transgressions again if I was once punished for violating legal norms. / Kung minsan na akong naparusahan dahil sa paglabag sa batas, pagninilayan ko ang sarili kong mga pagkakamali at sisiguraduhin kong hindi ko na uulitin ang ganoong paglabag.","id":"Jika saya pernah dihukum karena melanggar norma hukum, saya akan merenungkan kesalahan saya sendiri dan memastikan tidak mengulangi pelanggaran seperti itu lagi.","vi":"Nếu từng bị xử phạt vì vi phạm pháp luật, tôi sẽ tự nhìn lại lỗi của mình và bảo đảm không tái phạm những vi phạm như vậy nữa.","th":"ถ้าฉันเคยถูกลงโทษเพราะทำผิดกฎหมาย ฉันจะทบทวนข้อผิดพลาดของตัวเอง และจะไม่ทำผิดแบบนั้นซ้ำอีก"}},{"id":"B07","type":"scale","anchors":{"low":{"en":"Not at All / Hindi talaga","id":"Sama sekali tidak","vi":"Hoàn toàn không đúng","th":"ไม่ตรงเลย"},"high":{"en":"Completely / Lubos","id":"Sepenuhnya","vi":"Hoàn toàn đúng","th":"ตรงทั้งหมด"}},"label":{"en":"I will still make sure to comply with traffic regulations in the absence of surveillance. / Sisiguraduhin ko pa ring sumunod sa mga batas trapiko kahit walang nagbabantay.","id":"Saya tetap akan mematuhi peraturan lalu lintas meskipun tidak ada pengawasan.","vi":"Tôi vẫn sẽ tuân thủ luật giao thông ngay cả khi không có ai giám sát.","th":"ฉันจะยังคงปฏิบัติตามกฎจราจร แม้ไม่มีใครคอยตรวจหรือเฝ้าดู"}},{"id":"B08","type":"scale","anchors":{"low":{"en":"Not at All / Hindi talaga","id":"Sama sekali tidak","vi":"Hoàn toàn không đúng","th":"ไม่ตรงเลย"},"high":{"en":"Completely / Lubos","id":"Sepenuhnya","vi":"Hoàn toàn đúng","th":"ตรงทั้งหมด"}},"label":{"en":"I will turn myself in right away despite the possibility of violating criminal law if I unintentionally harm someone. / Kung hindi ko sinasadyang makasakit ng tao, agad kong isusuko ang aking sarili kahit posibleng nakalabag ako sa batas kriminal.","id":"Jika saya tanpa sengaja mencelakai seseorang, saya akan segera menyerahkan diri meskipun mungkin saya melanggar hukum pidana.","vi":"Nếu vô tình gây thương tích cho người khác, tôi sẽ ra tự thú ngay dù có thể đã vi phạm luật hình sự.","th":"ถ้าฉันทำให้ผู้อื่นบาดเจ็บโดยไม่ได้ตั้งใจ ฉันจะเข้ามอบตัวทันที แม้อาจเป็นความผิดทางอาญา"}},{"id":"B09","type":"scale","anchors":{"low":{"en":"Not at All / Hindi talaga","id":"Sama sekali tidak","vi":"Hoàn toàn không đúng","th":"ไม่ตรงเลย"},"high":{"en":"Completely / Lubos","id":"Sepenuhnya","vi":"Hoàn toàn đúng","th":"ตรงทั้งหมด"}},"label":{"en":"I will choose to report it to the police right away if I witness someone being violated. / Kung makakita ako ng taong nabibiktima, pipiliin kong agad itong i-report sa pulis.","id":"Jika saya melihat seseorang menjadi korban, saya akan memilih untuk segera melaporkannya ke polisi.","vi":"Nếu chứng kiến ai đó bị xâm hại, tôi sẽ chọn báo ngay cho cảnh sát.","th":"ถ้าฉันเห็นใครถูกทำร้ายหรือตกเป็นเหยื่อ ฉันจะเลือกแจ้งตำรวจทันที"}},{"id":"B10","type":"scale","anchors":{"low":{"en":"Not at All / Hindi talaga","id":"Sama sekali tidak","vi":"Hoàn toàn không đúng","th":"ไม่ตรงเลย"},"high":{"en":"Completely / Lubos","id":"Sepenuhnya","vi":"Hoàn toàn đúng","th":"ตรงทั้งหมด"}},"label":{"en":"I will comply with tax laws despite a tight budget. / Susunod ako sa mga batas sa buwis kahit gipit ang aking budget.","id":"Saya akan mematuhi peraturan pajak meskipun keuangan saya sedang sulit.","vi":"Tôi sẽ tuân thủ luật thuế dù đang eo hẹp về tài chính.","th":"ฉันจะปฏิบัติตามกฎหมายภาษี แม้จะมีเงินไม่ค่อยพอใช้"}},{"id":"B11","type":"scale","anchors":{"low":{"en":"Not at All / Hindi talaga","id":"Sama sekali tidak","vi":"Hoàn toàn không đúng","th":"ไม่ตรงเลย"},"high":{"en":"Completely / Lubos","id":"Sepenuhnya","vi":"Hoàn toàn đúng","th":"ตรงทั้งหมด"}},"label":{"en":"I will compensate others in spite of difficulties if I cause losses to them by violating their rights. / Kung makapagdulot ako ng pagkalugi sa iba dahil sa paglabag ko sa kanilang mga karapatan, babayaran ko sila kahit mahirap.","id":"Jika saya menyebabkan kerugian bagi orang lain karena melanggar hak mereka, saya akan memberi ganti rugi meskipun sulit.","vi":"Nếu tôi xâm phạm quyền lợi của người khác và gây thiệt hại cho họ, tôi sẽ bồi thường dù gặp khó khăn.","th":"ถ้าฉันทำให้ผู้อื่นเสียหายเพราะละเมิดสิทธิของเขา ฉันจะชดใช้ให้แม้จะลำบาก"}},{"id":"B12","type":"scale","anchors":{"low":{"en":"Not at All / Hindi talaga","id":"Sama sekali tidak","vi":"Hoàn toàn không đúng","th":"ไม่ตรงเลย"},"high":{"en":"Completely / Lubos","id":"Sepenuhnya","vi":"Hoàn toàn đúng","th":"ตรงทั้งหมด"}},"label":{"en":"When I owe someone money, I will not default; I will strive to repay them even if I'm facing financial difficulties. / Kapag may utang ako sa isang tao, hindi ako tatakas sa pagbabayad; sisikapin kong bayaran siya kahit nahihirapan ako sa pera.","id":"Ketika saya berutang kepada seseorang, saya tidak akan mangkir; saya akan berusaha melunasinya meskipun sedang mengalami kesulitan keuangan.","vi":"Khi nợ tiền ai đó, tôi sẽ không quỵt nợ; tôi sẽ cố gắng trả dù đang gặp khó khăn về tài chính.","th":"เมื่อฉันเป็นหนี้ใคร ฉันจะไม่เบี้ยวหนี้ และจะพยายามชดใช้ให้ แม้จะมีปัญหาทางการเงินก็ตาม"}}]},
    {"id":"partC1","title":{"en":"Part C / Bahagi C","id":"Bagian C","vi":"Phần C","th":"ส่วน C"},"items":[{"id":"C_intro","type":"info","label":{"en":"**Below are some situations you might face.** Please imagine that these happen to you and choose the answer that is closest to what you think. This survey is anonymous, and there are no right or wrong answers.\n\n**Narito ang ilang sitwasyon na maaari mong maranasan.** Isipin mong nangyayari ito sa iyo at piliin ang sagot na pinakamalapit sa iniisip mo. Anonymous ang survey na ito, at walang tama o maling sagot.","id":"**Berikut adalah beberapa situasi yang mungkin Anda hadapi.** Bayangkan hal-hal ini terjadi pada Anda, lalu pilih jawaban yang paling mendekati pendapat Anda. Survei ini bersifat anonim, dan tidak ada jawaban benar atau salah.","vi":"**Dưới đây là một số tình huống bạn có thể gặp.** Hãy tưởng tượng những điều này xảy ra với bạn và chọn câu trả lời gần nhất với suy nghĩ của bạn. Khảo sát này là ẩn danh, và không có câu trả lời đúng hay sai.","th":"**ต่อไปนี้เป็นสถานการณ์ที่คุณอาจพบเจอ** กรุณาจินตนาการว่าเรื่องเหล่านี้เกิดขึ้นกับคุณ แล้วเลือกคำตอบที่ใกล้เคียงกับความคิดของคุณมากที่สุด แบบสอบถามนี้ไม่ระบุตัวตน และไม่มีคำตอบที่ถูกหรือผิด"}},{"id":"C1_Q1","type":"scale","context":{"en":"**Situation 1 / Sitwasyon 1**\nOn Facebook, you see a post from someone who wants to buy bank accounts. They will pay you NT$9,000 for your ATM card and PIN. You would meet at a convenience store to make the exchange.\n\nSa Facebook, may nakita kang post ng isang taong gustong bumili ng mga bank account. Babayaran ka niya ng NT$9,000 kapalit ng iyong ATM card at PIN. Magkikita kayo sa isang convenience store para sa palitan.","id":"**Situasi 1**\nDi Facebook, Anda melihat unggahan dari seseorang yang ingin membeli rekening bank. Ia akan membayar Anda NT$9.000 untuk kartu ATM dan PIN Anda. Kalian akan bertemu di minimarket untuk melakukan pertukaran.","vi":"**Tình huống 1**\nTrên Facebook, bạn thấy bài đăng của một người muốn mua tài khoản ngân hàng. Họ sẽ trả bạn 9.000 Đài tệ để lấy thẻ ATM và mã PIN của bạn. Hai bên sẽ gặp nhau ở cửa hàng tiện lợi để trao đổi.","th":"**สถานการณ์ที่ 1**\nบน Facebook คุณเห็นโพสต์ของคนที่ต้องการซื้อบัญชีธนาคาร เขาจะจ่ายเงินให้คุณ 9,000 เหรียญไต้หวัน แลกกับบัตร ATM และรหัส PIN ของคุณ โดยจะนัดเจอกันที่ร้านสะดวกซื้อเพื่อแลกเปลี่ยน"},"anchors":{"low":{"en":"Definitely would not / Siguradong hindi","id":"Pasti tidak akan","vi":"Chắc chắn không đưa","th":"ไม่ให้แน่นอน"},"high":{"en":"Definitely would / Siguradong oo","id":"Pasti akan","vi":"Chắc chắn sẽ đưa","th":"ให้แน่นอน"}},"label":{"en":"Would you give your ATM card and PIN to this person? / Ibibigay mo ba ang iyong ATM card at PIN sa taong ito?","id":"Apakah Anda akan memberikan kartu ATM dan PIN Anda kepada orang ini?","vi":"Bạn có đưa thẻ ATM và mã PIN của mình cho người này không?","th":"คุณจะให้บัตร ATM และรหัส PIN ของคุณกับคนนี้หรือไม่"}},{"id":"C2_Q1","type":"scale","context":{"en":"**Situation 2 / Sitwasyon 2**\nYou need money urgently. On Facebook, you see an ad offering “loans for foreign workers.” The person says they can lend you NT$10,000, but you must first give them your ATM card and PIN as a guarantee.\n\nKailangan mo agad ng pera. Sa Facebook, may nakita kang ad na nag-aalok ng “loan para sa mga foreign worker.” Sabi ng tao, mapapahiram ka niya ng NT$10,000, pero kailangan mo munang ibigay sa kanya ang iyong ATM card at PIN bilang garantiya.","id":"**Situasi 2**\nAnda sedang sangat membutuhkan uang. Di Facebook, Anda melihat iklan yang menawarkan “pinjaman untuk pekerja asing”. Orang itu berkata ia bisa meminjamkan NT$10.000 kepada Anda, tetapi Anda harus terlebih dahulu menyerahkan kartu ATM dan PIN Anda sebagai jaminan.","vi":"**Tình huống 2**\nBạn đang cần tiền gấp. Trên Facebook, bạn thấy một quảng cáo “cho lao động nước ngoài vay tiền”. Người đó nói có thể cho bạn vay 10.000 Đài tệ, nhưng bạn phải đưa trước thẻ ATM và mã PIN của mình để làm tin.","th":"**สถานการณ์ที่ 2**\nคุณต้องการเงินด่วน บน Facebook คุณเห็นโฆษณา “เงินกู้สำหรับแรงงานต่างชาติ” คนนั้นบอกว่าจะให้คุณกู้ 10,000 เหรียญไต้หวันได้ แต่คุณต้องให้บัตร ATM และรหัส PIN ของคุณไว้ก่อนเป็นหลักประกัน"},"anchors":{"low":{"en":"Definitely would not / Siguradong hindi","id":"Pasti tidak akan","vi":"Chắc chắn không đưa","th":"ไม่ให้แน่นอน"},"high":{"en":"Definitely would / Siguradong oo","id":"Pasti akan","vi":"Chắc chắn sẽ đưa","th":"ให้แน่นอน"}},"label":{"en":"Would you give your ATM card and PIN to this person? / Ibibigay mo ba ang iyong ATM card at PIN sa taong ito?","id":"Apakah Anda akan memberikan kartu ATM dan PIN Anda kepada orang ini?","vi":"Bạn có đưa thẻ ATM và mã PIN của mình cho người này không?","th":"คุณจะให้บัตร ATM และรหัส PIN ของคุณกับคนนี้หรือไม่"}},{"id":"C3_Q1","type":"scale","context":{"en":"**Situation 3 / Sitwasyon 3**\nA friend from your home country has known you for many years, says his bank account cannot be used. His sister wants to send him money from home, so he asks to borrow your ATM card and PIN. He will give them back after he takes out the money.\n\nIsang kaibigan mula sa iyong bansa na matagal mo nang kilala ang nagsabing hindi magamit ang kanyang bank account. Gustong padalhan siya ng pera ng kanyang kapatid na babae mula sa inyong bayan, kaya hinihiram niya ang iyong ATM card at PIN. Ibabalik niya ang mga ito pagkatapos niyang makuha ang pera.","id":"**Situasi 3**\nSeorang teman dari negara asal Anda yang sudah Anda kenal bertahun-tahun mengatakan bahwa rekening banknya tidak bisa digunakan. Saudara perempuannya ingin mengirim uang dari kampung halaman, jadi ia meminta untuk meminjam kartu ATM dan PIN Anda. Ia akan mengembalikannya setelah mengambil uangnya.","vi":"**Tình huống 3**\nMột người bạn đồng hương quen biết bạn nhiều năm nói rằng tài khoản ngân hàng của anh ấy không dùng được. Chị gái hoặc em gái của anh ấy muốn gửi tiền từ quê sang, nên anh ấy hỏi mượn thẻ ATM và mã PIN của bạn. Anh ấy sẽ trả lại sau khi rút tiền.","th":"**สถานการณ์ที่ 3**\nเพื่อนจากประเทศบ้านเกิดเดียวกันที่รู้จักกับคุณมาหลายปีบอกว่าบัญชีธนาคารของเขาใช้ไม่ได้ พี่สาวหรือน้องสาวของเขาอยากโอนเงินมาจากบ้าน เขาจึงขอยืมบัตร ATM และรหัส PIN ของคุณ และจะคืนให้หลังจากถอนเงินแล้ว"},"anchors":{"low":{"en":"Definitely would not / Siguradong hindi","id":"Pasti tidak akan","vi":"Chắc chắn không đưa","th":"ไม่ให้แน่นอน"},"high":{"en":"Definitely would / Siguradong oo","id":"Pasti akan","vi":"Chắc chắn sẽ đưa","th":"ให้แน่นอน"}},"label":{"en":"Would you give your ATM card and PIN to your friend? / Ibibigay mo ba ang iyong ATM card at PIN sa iyong kaibigan?","id":"Apakah Anda akan memberikan kartu ATM dan PIN Anda kepada teman Anda?","vi":"Bạn có đưa thẻ ATM và mã PIN của mình cho người bạn này không?","th":"คุณจะให้บัตร ATM และรหัส PIN ของคุณกับเพื่อนคนนี้หรือไม่"}},{"id":"C4_Q1","type":"scale","context":{"en":"**Situation 4 / Sitwasyon 4**\nSomeone from your home country left his job and now cannot use his bank account. He says his new boss wants to pay his salary. He asks to borrow your ATM card and PIN and will give them back after he takes out the money.\n\nIsang kababayan mo ang umalis sa kanyang trabaho at ngayon ay hindi na magamit ang kanyang bank account. Sabi niya, gusto ng kanyang bagong amo na ibigay ang kanyang sahod. Hinihiram niya ang iyong ATM card at PIN, at ibabalik niya ang mga ito pagkatapos niyang makuha ang pera.","id":"**Situasi 4**\nSeseorang dari negara asal Anda telah meninggalkan pekerjaannya dan sekarang tidak bisa menggunakan rekening banknya. Ia berkata bos barunya ingin membayar gajinya. Ia meminta untuk meminjam kartu ATM dan PIN Anda dan akan mengembalikannya setelah mengambil uangnya.","vi":"**Tình huống 4**\nMột người đồng hương đã bỏ việc và hiện không thể dùng tài khoản ngân hàng của mình. Anh ấy nói ông chủ mới muốn trả lương cho anh ấy. Anh ấy hỏi mượn thẻ ATM và mã PIN của bạn và sẽ trả lại sau khi rút tiền.","th":"**สถานการณ์ที่ 4**\nคนจากประเทศบ้านเกิดเดียวกับคุณคนหนึ่งออกจากงานไปแล้ว และตอนนี้ใช้บัญชีธนาคารของตัวเองไม่ได้ เขาบอกว่านายจ้างคนใหม่ต้องการจ่ายเงินเดือนให้เขา เขาจึงขอยืมบัตร ATM และรหัส PIN ของคุณ และจะคืนให้หลังจากถอนเงินแล้ว"},"anchors":{"low":{"en":"Definitely would not / Siguradong hindi","id":"Pasti tidak akan","vi":"Chắc chắn không đưa","th":"ไม่ให้แน่นอน"},"high":{"en":"Definitely would / Siguradong oo","id":"Pasti akan","vi":"Chắc chắn sẽ đưa","th":"ให้แน่นอน"}},"label":{"en":"Would you give your ATM card and PIN to this person? / Ibibigay mo ba ang iyong ATM card at PIN sa taong ito?","id":"Apakah Anda akan memberikan kartu ATM dan PIN Anda kepada orang ini?","vi":"Bạn có đưa thẻ ATM và mã PIN của mình cho người này không?","th":"คุณจะให้บัตร ATM และรหัส PIN ของคุณกับคนนี้หรือไม่"}}]},
    {"id":"partC2","title":{"en":"Part C / Bahagi C","id":"Bagian C","vi":"Phần C","th":"ส่วน C"},"items":[{"id":"C_intro2","type":"info","label":{"en":"**Here are the same situations again.** This time, please answer a different question.\n\n**Narito muli ang parehong mga sitwasyon.** Sa pagkakataong ito, sagutin ang ibang tanong.","id":"**Berikut adalah situasi yang sama sekali lagi.** Kali ini, silakan jawab pertanyaan yang berbeda.","vi":"**Dưới đây là các tình huống giống như trước.** Lần này, vui lòng trả lời một câu hỏi khác.","th":"**ต่อไปนี้เป็นสถานการณ์เดิมอีกครั้ง** ครั้งนี้กรุณาตอบคำถามอีกข้อหนึ่ง"}},{"id":"C1_Q2","type":"scale","context":{"en":"**Situation 1 / Sitwasyon 1**\nOn Facebook, you see a post from someone who wants to buy bank accounts. They will pay you NT$9,000 for your ATM card and PIN. You would meet at a convenience store to make the exchange.\n\nSa Facebook, may nakita kang post ng isang taong gustong bumili ng mga bank account. Babayaran ka niya ng NT$9,000 kapalit ng iyong ATM card at PIN. Magkikita kayo sa isang convenience store para sa palitan.","id":"**Situasi 1**\nDi Facebook, Anda melihat unggahan dari seseorang yang ingin membeli rekening bank. Ia akan membayar Anda NT$9.000 untuk kartu ATM dan PIN Anda. Kalian akan bertemu di minimarket untuk melakukan pertukaran.","vi":"**Tình huống 1**\nTrên Facebook, bạn thấy bài đăng của một người muốn mua tài khoản ngân hàng. Họ sẽ trả bạn 9.000 Đài tệ để lấy thẻ ATM và mã PIN của bạn. Hai bên sẽ gặp nhau ở cửa hàng tiện lợi để trao đổi.","th":"**สถานการณ์ที่ 1**\nบน Facebook คุณเห็นโพสต์ของคนที่ต้องการซื้อบัญชีธนาคาร เขาจะจ่ายเงินให้คุณ 9,000 เหรียญไต้หวัน แลกกับบัตร ATM และรหัส PIN ของคุณ โดยจะนัดเจอกันที่ร้านสะดวกซื้อเพื่อแลกเปลี่ยน"},"anchors":{"low":{"en":"Very unlikely / Napakaliit ng posibilidad","id":"Sangat tidak mungkin","vi":"Rất khó xảy ra","th":"เป็นไปได้น้อยมาก"},"high":{"en":"Very likely / Napakalaki ng posibilidad","id":"Sangat mungkin","vi":"Rất có khả năng","th":"เป็นไปได้มาก"}},"label":{"en":"How likely is it that your account would be used to scam people if you did this? / Gaano kalamang na gagamitin ang iyong account para manloko ng ibang tao kung gagawin mo ito?","id":"Jika Anda melakukan ini, seberapa besar kemungkinan rekening Anda akan digunakan untuk menipu orang?","vi":"Nếu bạn làm vậy, khả năng tài khoản của bạn bị dùng để lừa đảo người khác là bao nhiêu?","th":"ถ้าคุณทำแบบนี้ บัญชีของคุณมีโอกาสถูกนำไปใช้หลอกลวงผู้อื่นมากน้อยเพียงใด"}},{"id":"C2_Q2","type":"scale","context":{"en":"**Situation 2 / Sitwasyon 2**\nYou need money urgently. On Facebook, you see an ad offering “loans for foreign workers.” The person says they can lend you NT$10,000, but you must first give them your ATM card and PIN as a guarantee.\n\nKailangan mo agad ng pera. Sa Facebook, may nakita kang ad na nag-aalok ng “loan para sa mga foreign worker.” Sabi ng tao, mapapahiram ka niya ng NT$10,000, pero kailangan mo munang ibigay sa kanya ang iyong ATM card at PIN bilang garantiya.","id":"**Situasi 2**\nAnda sedang sangat membutuhkan uang. Di Facebook, Anda melihat iklan yang menawarkan “pinjaman untuk pekerja asing”. Orang itu berkata ia bisa meminjamkan NT$10.000 kepada Anda, tetapi Anda harus terlebih dahulu menyerahkan kartu ATM dan PIN Anda sebagai jaminan.","vi":"**Tình huống 2**\nBạn đang cần tiền gấp. Trên Facebook, bạn thấy một quảng cáo “cho lao động nước ngoài vay tiền”. Người đó nói có thể cho bạn vay 10.000 Đài tệ, nhưng bạn phải đưa trước thẻ ATM và mã PIN của mình để làm tin.","th":"**สถานการณ์ที่ 2**\nคุณต้องการเงินด่วน บน Facebook คุณเห็นโฆษณา “เงินกู้สำหรับแรงงานต่างชาติ” คนนั้นบอกว่าจะให้คุณกู้ 10,000 เหรียญไต้หวันได้ แต่คุณต้องให้บัตร ATM และรหัส PIN ของคุณไว้ก่อนเป็นหลักประกัน"},"anchors":{"low":{"en":"Very unlikely / Napakaliit ng posibilidad","id":"Sangat tidak mungkin","vi":"Rất khó xảy ra","th":"เป็นไปได้น้อยมาก"},"high":{"en":"Very likely / Napakalaki ng posibilidad","id":"Sangat mungkin","vi":"Rất có khả năng","th":"เป็นไปได้มาก"}},"label":{"en":"How likely is it that your account would be used to scam people if you did this? / Gaano kalamang na gagamitin ang iyong account para manloko ng ibang tao kung gagawin mo ito?","id":"Jika Anda melakukan ini, seberapa besar kemungkinan rekening Anda akan digunakan untuk menipu orang?","vi":"Nếu bạn làm vậy, khả năng tài khoản của bạn bị dùng để lừa đảo người khác là bao nhiêu?","th":"ถ้าคุณทำแบบนี้ บัญชีของคุณมีโอกาสถูกนำไปใช้หลอกลวงผู้อื่นมากน้อยเพียงใด"}},{"id":"C3_Q2","type":"scale","context":{"en":"**Situation 3 / Sitwasyon 3**\nA friend from your home country has known you for many years, says his bank account cannot be used. His sister wants to send him money from home, so he asks to borrow your ATM card and PIN. He will give them back after he takes out the money.\n\nIsang kaibigan mula sa iyong bansa na matagal mo nang kilala ang nagsabing hindi magamit ang kanyang bank account. Gustong padalhan siya ng pera ng kanyang kapatid na babae mula sa inyong bayan, kaya hinihiram niya ang iyong ATM card at PIN. Ibabalik niya ang mga ito pagkatapos niyang makuha ang pera.","id":"**Situasi 3**\nSeorang teman dari negara asal Anda yang sudah Anda kenal bertahun-tahun mengatakan bahwa rekening banknya tidak bisa digunakan. Saudara perempuannya ingin mengirim uang dari kampung halaman, jadi ia meminta untuk meminjam kartu ATM dan PIN Anda. Ia akan mengembalikannya setelah mengambil uangnya.","vi":"**Tình huống 3**\nMột người bạn đồng hương quen biết bạn nhiều năm nói rằng tài khoản ngân hàng của anh ấy không dùng được. Chị gái hoặc em gái của anh ấy muốn gửi tiền từ quê sang, nên anh ấy hỏi mượn thẻ ATM và mã PIN của bạn. Anh ấy sẽ trả lại sau khi rút tiền.","th":"**สถานการณ์ที่ 3**\nเพื่อนจากประเทศบ้านเกิดเดียวกันที่รู้จักกับคุณมาหลายปีบอกว่าบัญชีธนาคารของเขาใช้ไม่ได้ พี่สาวหรือน้องสาวของเขาอยากโอนเงินมาจากบ้าน เขาจึงขอยืมบัตร ATM และรหัส PIN ของคุณ และจะคืนให้หลังจากถอนเงินแล้ว"},"anchors":{"low":{"en":"Very unlikely / Napakaliit ng posibilidad","id":"Sangat tidak mungkin","vi":"Rất khó xảy ra","th":"เป็นไปได้น้อยมาก"},"high":{"en":"Very likely / Napakalaki ng posibilidad","id":"Sangat mungkin","vi":"Rất có khả năng","th":"เป็นไปได้มาก"}},"label":{"en":"How likely is it that your account would be used to scam people if you did this? / Gaano kalamang na gagamitin ang iyong account para manloko ng ibang tao kung gagawin mo ito?","id":"Jika Anda melakukan ini, seberapa besar kemungkinan rekening Anda akan digunakan untuk menipu orang?","vi":"Nếu bạn làm vậy, khả năng tài khoản của bạn bị dùng để lừa đảo người khác là bao nhiêu?","th":"ถ้าคุณทำแบบนี้ บัญชีของคุณมีโอกาสถูกนำไปใช้หลอกลวงผู้อื่นมากน้อยเพียงใด"}},{"id":"C4_Q2","type":"scale","context":{"en":"**Situation 4 / Sitwasyon 4**\nSomeone from your home country left his job and now cannot use his bank account. He says his new boss wants to pay his salary. He asks to borrow your ATM card and PIN and will give them back after he takes out the money.\n\nIsang kababayan mo ang umalis sa kanyang trabaho at ngayon ay hindi na magamit ang kanyang bank account. Sabi niya, gusto ng kanyang bagong amo na ibigay ang kanyang sahod. Hinihiram niya ang iyong ATM card at PIN, at ibabalik niya ang mga ito pagkatapos niyang makuha ang pera.","id":"**Situasi 4**\nSeseorang dari negara asal Anda telah meninggalkan pekerjaannya dan sekarang tidak bisa menggunakan rekening banknya. Ia berkata bos barunya ingin membayar gajinya. Ia meminta untuk meminjam kartu ATM dan PIN Anda dan akan mengembalikannya setelah mengambil uangnya.","vi":"**Tình huống 4**\nMột người đồng hương đã bỏ việc và hiện không thể dùng tài khoản ngân hàng của mình. Anh ấy nói ông chủ mới muốn trả lương cho anh ấy. Anh ấy hỏi mượn thẻ ATM và mã PIN của bạn và sẽ trả lại sau khi rút tiền.","th":"**สถานการณ์ที่ 4**\nคนจากประเทศบ้านเกิดเดียวกับคุณคนหนึ่งออกจากงานไปแล้ว และตอนนี้ใช้บัญชีธนาคารของตัวเองไม่ได้ เขาบอกว่านายจ้างคนใหม่ต้องการจ่ายเงินเดือนให้เขา เขาจึงขอยืมบัตร ATM และรหัส PIN ของคุณ และจะคืนให้หลังจากถอนเงินแล้ว"},"anchors":{"low":{"en":"Very unlikely / Napakaliit ng posibilidad","id":"Sangat tidak mungkin","vi":"Rất khó xảy ra","th":"เป็นไปได้น้อยมาก"},"high":{"en":"Very likely / Napakalaki ng posibilidad","id":"Sangat mungkin","vi":"Rất có khả năng","th":"เป็นไปได้มาก"}},"label":{"en":"How likely is it that your account would be used to scam people if you did this? / Gaano kalamang na gagamitin ang iyong account para manloko ng ibang tao kung gagawin mo ito?","id":"Jika Anda melakukan ini, seberapa besar kemungkinan rekening Anda akan digunakan untuk menipu orang?","vi":"Nếu bạn làm vậy, khả năng tài khoản của bạn bị dùng để lừa đảo người khác là bao nhiêu?","th":"ถ้าคุณทำแบบนี้ บัญชีของคุณมีโอกาสถูกนำไปใช้หลอกลวงผู้อื่นมากน้อยเพียงใด"}},{"id":"C5","type":"single","label":{"en":"In Taiwan, giving your bank account (e.g., ATM card and PIN) to someone else to use may be illegal, even if you receive nothing in return. / Sa Taiwan, ang pagbibigay ng iyong bank account (halimbawa, ATM card at PIN) sa ibang tao para gamitin nila ay maaaring ilegal, kahit wala kang natatanggap na kapalit.","id":"Di Taiwan, memberikan rekening bank Anda (misalnya kartu ATM dan PIN) kepada orang lain untuk digunakan bisa jadi melanggar hukum, meskipun Anda tidak menerima imbalan apa pun.","vi":"Ở Đài Loan, việc đưa tài khoản ngân hàng của bạn (ví dụ: thẻ ATM và mã PIN) cho người khác sử dụng có thể là vi phạm pháp luật, ngay cả khi bạn không nhận được gì.","th":"ในไต้หวัน การให้ผู้อื่นใช้บัญชีธนาคารของคุณ (เช่น บัตร ATM และรหัส PIN) อาจผิดกฎหมาย แม้คุณจะไม่ได้รับสิ่งตอบแทนใดๆ"},"options":[{"value":1,"label":{"en":"True / Tama","id":"Benar","vi":"Đúng","th":"จริง"}},{"value":2,"label":{"en":"False / Mali","id":"Salah","vi":"Sai","th":"ไม่จริง"}},{"value":3,"label":{"en":"Don't know / Hindi ko alam","id":"Tidak tahu","vi":"Không biết","th":"ไม่ทราบ"}}]}]},

/* =====================================================================
   2. 問卷程式（一般不需要修改）
   ===================================================================== */
const KEY_DRAFT = "draft_" + CONFIG.surveyId;
const KEY_DONE = "done_" + CONFIG.surveyId;
const KEY_PENDING = "pending_" + CONFIG.surveyId;
const app = document.getElementById("app");

const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

let S = { page: "lang", lang: null, answers: {}, consent: { age: false, agree: false }, hp: "",
          start: null, respId: null, sec: 0, warned: {}, showMissing: false, lastPayload: null };

const allItems = CONFIG.sections.flatMap(s => s.items);
const dependedOn = new Set(allItems.filter(i => i.showIf).map(i => i.showIf.item));

function t(obj) {
  if (obj == null) return "";
  if (typeof obj === "string") return obj;
  return obj[S.lang] ?? obj.en ?? obj.zh ?? Object.values(obj)[0];
}
function ui(key, vars) {
  let s = t(CONFIG.ui[key]);
  if (vars) for (const k in vars) s = s.replace("{" + k + "}", vars[k]);
  return s;
}
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "text") n.textContent = v;
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c);
  return n;
}
function add(...kids) {
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) app.append(c);
}
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
function saveDraft() {
  const { lastPayload, ...d } = S;
  store.set(KEY_DRAFT, d);
}
function go(page) { S.page = page; saveDraft(); render(); window.scrollTo(0, 0); }

function visible(item) {
  if (!item.showIf) return true;
  return item.showIf.in.includes(S.answers[item.showIf.item]);
}
// 量表選項：有 anchors 的題目只標兩端（1 · 低端文字 … 5 · 高端文字），否則用共用量表
// 英文版「English / Tagalog」分兩行顯示：英文在上，他加祿語在下（只在第一個「 / 」處分開）
// 例外：題目下方的 Note／說明小字不分行，英文與他加祿語用「 / 」隔開、同樣大小
function bi(str) {
  if (S.lang !== "en" || typeof str !== "string" || !str.includes(" / ")) return str;
  const i = str.indexOf(" / ");
  return [el("span", { class: "bi-en", text: str.slice(0, i) }), el("span", { class: "bi-tl", lang: "tl", text: str.slice(i + 3) })];
}
// 說明文字裡用 **…** 標示粗體
function rich(str) {
  return String(str).split(/\*\*(.+?)\*\*/).map((part, i) => i % 2 ? el("strong", { text: part }) : part).filter(x => x !== "");
}
function scaleOpts(item) {
  if (!item.anchors) return CONFIG.scales[item.scale];
  const n = item.points || 5;
  return Array.from({ length: n }, (_, i) => {
    const v = i + 1;
    const end = v === 1 ? item.anchors.low : v === n ? item.anchors.high : null;
    return { value: v, label: end ? { en: v + " · " + (end.en || ""), ...Object.fromEntries(Object.entries(end).map(([k, x]) => [k, v + " · " + x])) } : String(v) };
  });
}
function answered(item) {
  const v = S.answers[item.id];
  return v !== undefined && v !== null && v !== "";
}
// 已作答且（若選了「其他」）有填說明，才算完成
function complete(item) {
  if (!answered(item)) return false;
  const chosen = (item.options || []).find(o => o.value === S.answers[item.id]);
  return !(chosen && chosen.other && !(S.answers[item.id + "_other"] || "").trim());
}
function numError(item) {
  const v = S.answers[item.id];
  if (item.type !== "number" || v === undefined || v === "") return false;
  return !(Number.isFinite(v) && v >= item.min && v <= item.max);
}

/* ---------- 畫面 ---------- */
function render() {
  app.replaceChildren();
  document.documentElement.lang = S.lang === "zh" ? "zh-Hant" : (S.lang || "zh-Hant");
  ({ lang: renderLang, consent: renderConsent, declined: renderDeclined, section: renderSection,
     sending: renderSending, failed: renderFailed, thanks: renderThanks })[S.page]();
}

function renderLang() {
  const htmlLang = { zh: "zh-Hant" };
  add(
    el("div", { class: "eyebrow", text: "National Taipei University · 國立臺北大學" }),
    el("p", { class: "choose-lang" },
      CONFIG.languages.filter(l => CONFIG.landing.choose[l.code]).map((l, i) => [
        i ? " · " : null,
        el("span", { class: "phrase", lang: htmlLang[l.code] || l.code, text: CONFIG.landing.choose[l.code] })])),
    // 每個語言一塊：語言名稱 + 該語言的研究標題，點整塊進入
    CONFIG.languages.map(l => el("button", { class: "lang-btn", type: "button", lang: htmlLang[l.code] || l.code,
      onclick: () => { S.lang = l.code; go("consent"); } },
      el("span", { class: "lang-text" },
        el("span", { class: "lang-name", text: l.name }),
        el("span", { class: "lang-title", text: CONFIG.consent.title[l.code] || "" })),
      el("span", { class: "lang-arrow", "aria-hidden": "true", text: "›" })))
  );
}

function renderConsent() {
  const startBtn = el("button", { class: "btn btn-primary", type: "button", disabled: !(S.consent.age && S.consent.agree),
    onclick: () => {
      if (!S.start) S.start = new Date().toISOString();
      if (!S.respId) S.respId = uuid();
      S.sec = 0; go("section");
    } }, ui("start"));
  const box = (key, label) => el("label", { class: "check" },
    el("input", { type: "checkbox", checked: S.consent[key], onchange: e => {
      S.consent[key] = e.target.checked; startBtn.disabled = !(S.consent.age && S.consent.agree); saveDraft(); } }),
    el("span", { text: label }));
  add(
    el("button", { class: "link-btn", type: "button", onclick: () => go("lang") }, "‹ " + ui("changeLang")),
    el("div", { class: "eyebrow", text: ui("university") }),
    el("h1", { text: t(CONFIG.consent.title) }),
    el("div", { class: "card letter" },
      el("p", { text: t(CONFIG.consent.greeting) }),
      CONFIG.consent.blocks.map(b => el("p", { text: t(b) })),
      el("div", { class: "signoff" }, CONFIG.consent.footer.map(f => el("div", { text: t(f) })))),
    // 防機器人欄位：真人看不到
    el("div", { class: "hp", "aria-hidden": "true" },
      el("label", {}, "Website", el("input", { type: "text", tabindex: "-1", autocomplete: "off", oninput: e => { S.hp = e.target.value; } }))),
    box("age", ui("ageCheck")),
    box("agree", ui("agreeCheck")),
    startBtn,
    el("button", { class: "link-btn", type: "button", style: "align-self: center", onclick: () => { store.del(KEY_DRAFT); S.page = "declined"; render(); window.scrollTo(0, 0); } }, ui("decline"))
  );
}

function renderDeclined() {
  add(el("h1", { text: ui("declinedTitle") }), el("p", { text: ui("declinedBody") }),
    el("button", { class: "btn btn-ghost", type: "button",
      onclick: () => { S.consent = { age: false, agree: false }; store.del(KEY_DRAFT); S.page = "lang"; render(); window.scrollTo(0, 0); } },
      ui("backToStart")));
}

function renderItem(item) {
  const missing = S.showMissing && visible(item) && item.type !== "info" && !item.optional && !complete(item);
  const card = el("div", { class: "card" + (missing ? " missing" : ""), id: "q-" + item.id });
  const set = v => {
    S.answers[item.id] = v; saveDraft();
    const hasOther = (item.options || []).some(o => o.other);
    if (dependedOn.has(item.id) || S.showMissing || hasOther) { const y = window.scrollY; render(); window.scrollTo(0, y); }
  };
  const hint = item.hint ? el("div", { class: "hint", text: t(item.hint) }) : "";
  // 選了「其他」時出現的說明輸入框
  const otherBox = () => {
    const chosen = (item.options || []).find(o => o.value === S.answers[item.id]);
    if (!chosen || !chosen.other) return "";
    const box = el("input", { type: "text", class: "other-in", maxlength: "200", "aria-label": t(chosen.label) + " – " + ui("otherPlaceholder"),
      placeholder: ui("otherPlaceholder"), oninput: e => { S.answers[item.id + "_other"] = e.target.value; saveDraft(); } });
    box.value = S.answers[item.id + "_other"] ?? "";
    return box;
  };
  // 情境文字：顯示在題目上方的灰底框
  if (item.context) card.append(el("div", { class: "vignette context" }, rich(t(item.context))));
  if (item.type === "info") {
    card.append(el("div", { class: "vignette" }, rich(t(item.label))));
  } else if (item.type === "scale" && ["slider-h", "slider-v"].includes(item.layout || CONFIG.scaleLayout)) {
    // 拉桿：一開始沒有預設答案（看不到拉桿頭），拖動或點一下才算作答
    const opts = scaleOpts(item);
    const cur = S.answers[item.id];
    const vertical = (item.layout || CONFIG.scaleLayout) === "slider-v";
    const label = el("div", { class: "slider-val", "aria-hidden": "true",
      text: cur ? t(opts.find(o => o.value === cur).label) : "" });
    const input = el("input", { id: "in-" + item.id, type: "range", min: opts[0].value, max: opts[opts.length - 1].value, step: 1,
      value: cur ?? Math.round((opts[0].value + opts[opts.length - 1].value) / 2),
      class: (vertical ? "slider-v" : "slider") + (cur ? "" : " untouched"),
      "aria-valuetext": cur ? t(opts.find(o => o.value === cur).label) : "",
      // 點在中間（數值沒變）時 input 事件不會觸發，所以 click 也要算作答
      oninput: e => commit(e.target),
      onclick: e => commit(e.target),
      onchange: e => commit(e.target) });
    function commit(target) {
      const v = Number(target.value);
      S.answers[item.id] = v; saveDraft();
      target.classList.remove("untouched");
      const txt = t(opts.find(o => o.value === v).label);
      label.textContent = txt; target.setAttribute("aria-valuetext", txt);
      if (S.showMissing) card.classList.remove("missing");
    }
    card.append(el("label", { class: "q", for: "in-" + item.id }, bi(t(item.label))), hint);
    if (vertical) {
      card.append(el("div", { class: "slider-v-wrap" }, input,
        el("div", { class: "ticks-v", "aria-hidden": "true" }, opts.slice().reverse().map((o, i) =>
          el("span", { style: "top:" + (i / (opts.length - 1) * 100) + "%", text: t(o.label) })))));
    } else {
      card.append(el("div", { class: "slider-wrap" }, input,
        el("div", { class: "ticks", "aria-hidden": "true" }, opts.map((o, i) =>
          el("span", { style: "left:" + (i / (opts.length - 1) * 100) + "%", text: String(o.value) }))),
        el("div", { class: "ends", "aria-hidden": "true" },
          el("span", {}, bi(item.anchors ? t(item.anchors.low) : t(opts[0].label))),
          el("span", {}, bi(item.anchors ? t(item.anchors.high) : t(opts[opts.length - 1].label))))));
    }
    // 選好的答案不另外顯示在拉桿下方（只保留給螢幕閱讀器的 aria-valuetext）
  } else if (item.type === "single" || item.type === "scale") {
    const opts = item.type === "scale" ? scaleOpts(item) : item.options;
    card.append(el("fieldset", {}, el("legend", {}, bi(t(item.label))), hint,
      opts.map(o => el("label", { class: "opt" },
        el("input", { type: "radio", name: item.id, value: String(o.value), checked: S.answers[item.id] === o.value,
          onchange: () => set(o.value) }),
        el("span", {}, bi(t(o.label))))), otherBox()));
  } else if (item.type === "select") {
    const sel = el("select", { id: "in-" + item.id, onchange: e => set(e.target.value === "" ? "" : Number(e.target.value)) },
      el("option", { value: "", text: ui("choose") }),
      item.options.map(o => el("option", { value: String(o.value), selected: S.answers[item.id] === o.value, text: t(o.label) })));
    card.append(el("label", { class: "q", for: "in-" + item.id }, bi(t(item.label))), hint, sel, otherBox());
  } else if (item.type === "money") {
    // 金額：自動加千分位（依語言用 , 或 .），旁邊顯示貨幣單位
    const cur = CONFIG.currency[S.lang] || CONFIG.currency.en;
    const fmt = n => new Intl.NumberFormat(cur.locale, { maximumFractionDigits: 0 }).format(n);
    const v0 = S.answers[item.id];
    const inp = el("input", { id: "in-" + item.id, type: "text", inputmode: "numeric", autocomplete: "off", class: "money-in",
      oninput: e => {
        const digits = e.target.value.replace(/\D/g, "").replace(/^0+(?=\d)/, "").slice(0, 15);
        S.answers[item.id] = digits === "" ? "" : Number(digits); saveDraft();
        e.target.value = digits === "" ? "" : fmt(Number(digits));
      } });
    inp.value = (v0 === undefined || v0 === "") ? "" : fmt(v0);
    card.append(el("label", { class: "q", for: "in-" + item.id }, bi(t(item.label))), hint,
      el("div", { class: "num-row" }, inp, el("span", { class: "unit", text: cur.unit })));
  } else if (item.type === "number") {
    const err = el("div", { class: "err", text: numError(item) ? ui("numRange", { min: item.min, max: item.max }) : "" });
    card.append(el("label", { class: "q", for: "in-" + item.id }, bi(t(item.label))), hint,
      el("div", { class: "num-row" },
        el("input", { id: "in-" + item.id, type: "number", inputmode: "numeric", min: item.min, max: item.max,
          value: S.answers[item.id] ?? "",
          oninput: e => {
            const raw = e.target.value;
            S.answers[item.id] = raw === "" ? "" : Number(raw); saveDraft();
            err.textContent = numError(item) ? ui("numRange", { min: item.min, max: item.max }) : "";
          } }),
        item.unit ? el("span", { class: "unit", text: t(item.unit) }) : null), err);
  } else if (item.type === "text") {
    const ta = el("textarea", { id: "in-" + item.id, maxlength: item.maxLength || 1000,
      oninput: e => { S.answers[item.id] = e.target.value; saveDraft(); } });
    ta.value = S.answers[item.id] ?? "";
    card.append(el("label", { class: "q", for: "in-" + item.id }, bi(t(item.label))), ta);
  }
  return card;
}

function renderSection() {
  const sec = CONFIG.sections[S.sec];
  const total = CONFIG.sections.length;
  const last = S.sec === total - 1;
  const items = sec.items.filter(visible);
  add(
    el("div", { class: "muted", text: ui("page", { n: S.sec + 1, total }) }),
    el("div", { class: "progress", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(total), "aria-valuenow": String(S.sec + 1) },
      el("div", { style: "width:" + ((S.sec + 1) / total * 100) + "%" })),
    el("h1", {}, bi(t(sec.title))),
    S.showMissing ? el("div", { class: "banner", role: "alert", text: ui("missingBanner") }) : null,
    items.map(renderItem),
    el("div", { class: "btn-row" },
      el("button", { class: "btn btn-ghost", type: "button",
        onclick: () => { S.showMissing = false; if (S.sec === 0) go("consent"); else { S.sec--; go("section"); } } }, ui("back")),
      el("button", { class: "btn btn-primary", type: "button", onclick: () => next(items, last) }, last ? ui("submit") : ui("next")))
  );
}

function next(items, last) {
  const bad = items.find(numError);
  if (bad) { document.getElementById("q-" + bad.id).scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  const missing = items.filter(i => i.type !== "info" && !i.optional && !complete(i));
  if (missing.length && !S.warned[S.sec]) {
    S.warned[S.sec] = true; S.showMissing = true; saveDraft(); render();
    document.getElementById("q-" + missing[0].id).scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  S.showMissing = false;
  if (last) submit(); else { S.sec++; go("section"); }
}

/* ---------- 送出 ---------- */
function buildPayload() {
  const end = new Date();
  const p = {
    survey_id: CONFIG.surveyId, version: CONFIG.version, resp_id: S.respId, lang: S.lang,
    consent: 1, start_time: S.start, end_time: end.toISOString(),
    duration_sec: Math.round((end - new Date(S.start)) / 1000),
    device: /Mobi|Android|iPhone/i.test(navigator.userAgent) ? "mobile" : "desktop",
    prior_submit_on_device: store.get(KEY_DONE) ? 1 : 0,
    hp: S.hp
  };
  for (const item of allItems) {
    if (item.type === "info") continue;
    if (!visible(item)) p[item.id] = CONFIG.notShownCode;
    else if (!answered(item)) p[item.id] = CONFIG.missingCode;
    else p[item.id] = S.answers[item.id];
    if (item.type === "money") p[item.id + "_cur"] = (CONFIG.currency[S.lang] || CONFIG.currency.en).code;
    // 「其他」的說明文字：有選「其他」才存內容，否則留空
    if ((item.options || []).some(o => o.other)) {
      const chosen = item.options.find(o => o.value === S.answers[item.id]);
      p[item.id + "_other"] = visible(item) && chosen && chosen.other ? (S.answers[item.id + "_other"] || "").trim() : "";
    }
  }
  return p;
}

async function send(payload) {
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      // text/plain 是「簡單請求」，不會觸發 CORS 預檢，Apps Script 才收得到
      const res = await fetch(CONFIG.scriptUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
      const data = await res.json();
      if (data.ok) return true;
    } catch (e) {}
    await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));
  }
  return false;
}

async function submit() {
  const payload = buildPayload();
  S.lastPayload = payload;
  if (!CONFIG.scriptUrl) { finish(); return; }
  store.set(KEY_PENDING, payload);
  go("sending");
  const ok = await send(payload);
  if (ok) finish(); else go("failed");
}
function finish() {
  store.del(KEY_PENDING); store.del(KEY_DRAFT); store.set(KEY_DONE, 1);
  S.page = "thanks"; render(); window.scrollTo(0, 0);
}
async function retry() {
  const payload = store.get(KEY_PENDING) || S.lastPayload;
  go("sending");
  const ok = await send(payload);
  if (ok) finish(); else go("failed");
}

function renderSending() { add(el("h1", { text: ui("sending") })); }
function renderFailed() {
  add(el("h1", { text: ui("sendFailTitle") }), el("p", { text: ui("sendFailBody") }),
    el("button", { class: "btn btn-primary", type: "button", onclick: retry }, ui("retry")));
}
function renderThanks() {
  const status = el("div", { class: "muted", role: "status" });
  add(
    el("h1", { text: ui("thanksTitle") }), el("p", { text: ui("thanksBody") }),
    // 請填答者分享：手機支援時直接開啟分享選單（LINE、Facebook…），否則複製連結
    el("div", { class: "card share" },
      el("p", { class: "share-ask" }, bi(ui("shareAsk"))),
      el("button", { class: "btn btn-primary", type: "button", onclick: async () => {
        const url = location.href.split("#")[0];
        try {
          if (navigator.share) { await navigator.share({ url }); return; }  // 只分享網址，不附文字
        } catch (e) { if (e && e.name === "AbortError") return; }
        try { await navigator.clipboard.writeText(url); status.textContent = ui("copied"); } catch (e) {}
      } }, bi(ui("share"))),
      status),
    el("div", { class: "card" }, el("h2", { text: ui("hotlineTitle") }),
      el("div", { class: "hotline" }, el("b", { text: "165" }), el("p", { text: ui("hotline165") })),
      el("div", { class: "hotline" }, el("b", { text: "1955" }), el("p", { text: ui("hotline1955") })))
  );
  if (!CONFIG.scriptUrl && S.lastPayload) {
    add(el("p", { class: "muted", text: ui("demoNote") }), el("pre", { text: JSON.stringify(S.lastPayload, null, 2) }));
  }
}

/* ---------- 啟動：接續上次進度或補送 ---------- */
(async function init() {
  const pending = store.get(KEY_PENDING);
  const draft = store.get(KEY_DRAFT);
  if (draft && CONFIG.languages.some(l => l.code === draft.lang)) S = { ...S, ...draft, showMissing: false };
  if (["sending", "failed", "thanks", "declined"].includes(S.page)) S.page = "lang";
  if (pending && CONFIG.scriptUrl) {
    S.lang = pending.lang; S.lastPayload = pending;
    await retry();
    return;
  }
  render();
})();
</script>
